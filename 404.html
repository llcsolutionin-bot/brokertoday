<!DOCTYPE html>
<html lang="hi">
<head>
    <link rel="preconnect" href="https://llcsolution.duckdns.org" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://i.ibb.co">
    <link rel="dns-prefetch" href="https://drive.google.com">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>पेज नहीं मिला — Broker Today</title>
    <link rel="icon" type="image/svg+xml" href="brokertoday.svg">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
        .card{max-width:520px}
        .code{font-size:96px;font-weight:800;line-height:1;background:linear-gradient(120deg,#FF6D5A,#ffb199);-webkit-background-clip:text;background-clip:text;color:transparent}
        h1{font-size:24px;margin:12px 0 8px;color:#fff}
        p{color:#94a3b8;margin-bottom:24px;line-height:1.6}
        .links{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
        a{text-decoration:none;font-weight:700;font-size:14px;padding:12px 20px;border-radius:12px;transition:opacity .2s}
        a.primary{background:#FF6D5A;color:#fff}
        a.ghost{background:rgba(255,255,255,.08);color:#e2e8f0;border:1px solid rgba(255,255,255,.15)}
        a:hover{opacity:.9}
        .brand{margin-top:32px;font-size:12px;color:#64748b}
    </style>
</head>
<body>
    <div class="card">
        <div class="code">404</div>
        <h1>यह पेज नहीं मिला</h1>
        <p>जो पेज आप ढूँढ रहे हैं वह हटा दिया गया है या पता बदल गया है। नीचे से आगे बढ़ें।</p>
        <div class="links">
            <a class="primary" href="/">🏠 होम पेज</a>
            <a class="ghost" href="/rentals.html?type=rent">प्रॉपर्टी देखें</a>
            <a class="ghost" href="/index.html#projects">प्रोजेक्ट्स</a>
        </div>
        <div class="brand">Broker Today · सिरोही, राजस्थान</div>
    </div>
</body>
</html>
